<!-- 外部フォント・アイコン（非同期読み込み） -->

  onload="this.media='all'">
<link
  href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Michroma&family=Oswald:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap"
  rel="stylesheet" media="print" onload="this.media='all'">
<link href="https://use.fontawesome.com/releases/v7.2.0/css/all.css" rel="stylesheet" media="print"
  onload="this.media='all'">

<noscript>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp&display=swap" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Michroma&family=Oswald:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://use.fontawesome.com/releases/v7.2.0/css/all.css" rel="stylesheet">
</noscript>

<!-- OGP -->
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}">
<meta property="og:image" content="{{ page.og_image | default: '/image/ogp/default.jpg' | absolute_url }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:site_name" content="{{ site.title }}">

<meta name="twitter:card" content="summary_large_image">
